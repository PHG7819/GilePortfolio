<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <rect width="800" height="450" rx="10" fill="#14141a"/>
  <text x="32" y="52" fill="#ffffff" font-size="27" font-weight="700">PM 중심 크로스팀 커뮤니케이션</text>
  <text x="32" y="80" fill="#9a9aa0" font-size="15">Slack 채널 · Jira로 논의를 일원화하고 이슈를 시작~종결까지 추적</text>

  <!-- spokes -->
  <g stroke="#3a3a44" stroke-width="2">
    <line x1="400" y1="255" x2="180" y2="160"/>
    <line x1="400" y1="255" x2="400" y2="140"/>
    <line x1="400" y1="255" x2="620" y2="160"/>
    <line x1="400" y1="255" x2="220" y2="345"/>
    <line x1="400" y1="255" x2="580" y2="345"/>
  </g>

  <!-- outer nodes -->
  <g>
    <rect x="120" y="132" width="120" height="52" rx="26" fill="#1e1e26" stroke="rgba(255,255,255,.14)"/>
    <text x="180" y="164" fill="#e6e6e8" font-size="15" font-weight="600" text-anchor="middle">기획</text>

    <rect x="340" y="112" width="120" height="52" rx="26" fill="#1e1e26" stroke="rgba(255,255,255,.14)"/>
    <text x="400" y="144" fill="#e6e6e8" font-size="15" font-weight="600" text-anchor="middle">프로그램</text>

    <rect x="560" y="132" width="120" height="52" rx="26" fill="#1e1e26" stroke="rgba(255,255,255,.14)"/>
    <text x="620" y="164" fill="#e6e6e8" font-size="15" font-weight="600" text-anchor="middle">아트</text>

    <rect x="160" y="320" width="120" height="52" rx="26" fill="#1e1e26" stroke="rgba(255,255,255,.14)"/>
    <text x="220" y="352" fill="#e6e6e8" font-size="15" font-weight="600" text-anchor="middle">QA</text>

    <rect x="520" y="320" width="120" height="52" rx="26" fill="#1e1e26" stroke="rgba(255,255,255,.14)"/>
    <text x="580" y="352" fill="#e6e6e8" font-size="15" font-weight="600" text-anchor="middle">퍼블리셔</text>
  </g>

  <!-- center PM -->
  <circle cx="400" cy="255" r="52" fill="#243049" stroke="#6ea8fe" stroke-width="2"/>
  <text x="400" y="250" fill="#ffffff" font-size="20" font-weight="700" text-anchor="middle">PM</text>
  <text x="400" y="272" fill="#6ea8fe" font-size="12" text-anchor="middle">허브</text>

  <text x="400" y="418" fill="#9a9aa0" font-size="13" text-anchor="middle">개인 DM → 공식 채널 전환 · 회의록·결정 사항·일정 변동 정리 및 전파</text>
</svg>
