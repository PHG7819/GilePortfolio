<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <rect width="800" height="450" rx="10" fill="#14141a"/>
  <text x="32" y="50" fill="#ffffff" font-size="27" font-weight="700">AI 활용 업무 자동화 에이전트</text>
  <text x="32" y="77" fill="#9a9aa0" font-size="15">반복 수작업을 직접 만든 도구로 — 시간을 극적으로 단축</text>

  <!-- Card 1: 회의록 에이전트 -->
  <rect x="24" y="98" width="368" height="148" rx="11" fill="#243049" stroke="#6ea8fe" stroke-width="1.5"/>
  <text x="44" y="130" fill="#6ea8fe" font-size="11" font-weight="700">AI AGENT · 01</text>
  <text x="44" y="156" fill="#ffffff" font-size="17" font-weight="700">회의록 에이전트</text>
  <text x="44" y="178" fill="#c7c7cd" font-size="12">로컬 faster-whisper STT + 기획서 대조</text>
  <text x="44" y="220" fill="#7bd88f" font-size="21" font-weight="700">2~3시간 → 20분</text>
  <text x="248" y="220" fill="#9a9aa0" font-size="12">개발 리뷰 회의록 정리</text>

  <!-- Card 2: 주간보고 자동화 -->
  <rect x="408" y="98" width="368" height="148" rx="11" fill="#243049" stroke="#6ea8fe" stroke-width="1.5"/>
  <text x="428" y="130" fill="#6ea8fe" font-size="11" font-weight="700">AI AGENT · 02</text>
  <text x="428" y="156" fill="#ffffff" font-size="17" font-weight="700">주간보고 자동화</text>
  <text x="428" y="178" fill="#c7c7cd" font-size="12">퍼포스 서밋 분석 · 7개 서브에이전트</text>
  <text x="428" y="220" fill="#7bd88f" font-size="21" font-weight="700">2시간 → 20분</text>
  <text x="600" y="220" fill="#9a9aa0" font-size="12">각 실 주간보고 작성</text>

  <!-- Card 3: 지라 다중 릴레이트 -->
  <rect x="24" y="262" width="368" height="140" rx="11" fill="#1e1e26" stroke="rgba(255,255,255,.14)"/>
  <text x="44" y="294" fill="#8b93a7" font-size="11" font-weight="700">AI TOOL · 03</text>
  <text x="44" y="320" fill="#e6e6e8" font-size="17" font-weight="700">지라 다중 릴레이트 자동화</text>
  <text x="44" y="344" fill="#9a9aa0" font-size="13">일감 관계를 일괄 연결 — 수작업 반복 제거</text>
  <text x="44" y="374" fill="#9a9aa0" font-size="13">개별 머지 리스트 관리에 활용</text>

  <!-- Card 4: 빌드 테스트 웹 가이드 -->
  <rect x="408" y="262" width="368" height="140" rx="11" fill="#1e1e26" stroke="rgba(255,255,255,.14)"/>
  <text x="428" y="294" fill="#8b93a7" font-size="11" font-weight="700">AI TOOL · 04</text>
  <text x="428" y="320" fill="#e6e6e8" font-size="17" font-weight="700">빌드 테스트 웹 가이드</text>
  <text x="428" y="344" fill="#9a9aa0" font-size="13">마일스톤 마감 빌드 플레이테스트 가이드</text>
  <text x="428" y="374" fill="#9a9aa0" font-size="13">HTML 웹으로 제작·배포</text>
</svg>
